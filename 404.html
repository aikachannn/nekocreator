<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Loli Neko Creator</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #ffd6e8 0%, #fff0f5 30%, #e8f6ff 65%, #d6eeff 100%);
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      border: 1px solid #ffd6e8;
      padding: 40px 32px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(249,126,174,0.15);
    }
    .emoji { font-size: 56px; margin-bottom: 12px; }
    .code {
      font-size: 64px;
      font-weight: 900;
      background: linear-gradient(135deg, #f97eae, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 8px;
    }
    .title {
      font-size: 18px;
      font-weight: 800;
      color: #be185d;
      margin-bottom: 8px;
    }
    .desc {
      font-size: 13px;
      color: #9ca3af;
      font-weight: 700;
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #f97eae, #c084fc);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 14px;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(249,126,174,0.35);
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .watermark {
      margin-top: 20px;
      font-size: 11px;
      color: #f9a8d4;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🐱</div>
    <div class="code">404</div>
    <div class="title">Halaman Tidak Ditemukan</div>
    <div class="desc">
      Halaman yang kamu cari tidak ada.<br>
      Mungkin salah ketik URL? 🎀
    </div>
    <a href="/" class="btn">🏠 Kembali ke Home</a>
    <div class="watermark">Loli Neko Creator · nekocreator.my.id</div>
  </div>
</body>
</html>
